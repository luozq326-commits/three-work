<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperReader · 端侧文献精读</title>
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<script src="/static/vendor/katex/katex.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1c2029; --line:#262b36;
    --text:#e6e9ef; --muted:#8b93a7; --dim:#5f6675;
    --accent:#6ea8fe; --accent-dim:#2b4a7d;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{font:inherit; cursor:pointer; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); padding:7px 13px; transition:.15s}
  button:hover{border-color:var(--accent-dim); background:#222834}
  button.primary{background:var(--accent); color:#08111f; border-color:var(--accent); font-weight:600}
  button.primary:hover{background:#8ab8ff}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.ghost{background:transparent}
  input,select,textarea{font:inherit; background:var(--panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:7px; padding:7px 10px; outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent-dim)}

  /* 顶栏 */
  header{display:flex; align-items:center; gap:14px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:none}
  .logo{font-weight:700; letter-spacing:.3px}
  .logo span{color:var(--accent)}
  .status{display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12.5px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .dot.on{background:var(--ok); box-shadow:0 0 0 3px rgba(63,185,80,.15)}
  .dot.off{background:var(--bad)}
  header .spacer{flex:1}
  /* 自定义下拉：原生 select 在某些缩放/多屏环境下弹层会跑到左上角，索性自己画 */
  .dd{position:relative}
  .dd-btn{background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    padding:6px 11px; border-radius:7px; font-size:12.5px}
  .dd-btn b{color:var(--text); font-weight:600}
  .dd-menu{position:absolute; right:0; top:calc(100% + 6px); min-width:210px; display:none;
    background:#1b2029; border:1px solid var(--line); border-radius:9px; padding:5px;
    box-shadow:0 14px 34px rgba(0,0,0,.45); z-index:60}
  .dd.open .dd-menu{display:block}
  .dd-menu > div{padding:8px 10px; border-radius:6px; font-size:13px; cursor:pointer;
    color:var(--text); display:flex; align-items:center; gap:8px}
  .dd-menu > div:hover{background:#232a36}
  .dd-menu > div.sel{background:#1f2a3d; color:var(--accent)}
  .dd-menu .hint{color:var(--dim); font-size:11.5px; padding:2px 10px 6px; cursor:default}
  .dd-menu .hint:hover{background:transparent}

  /* 进度条 */
  #bar{height:2px; background:var(--line); flex:none; overflow:hidden}
  #bar > i{display:block; height:100%; width:0; background:var(--accent); transition:width .4s}

  /* 主区 */
  main{flex:1; display:grid; min-height:0;
    grid-template-columns:var(--lw,250px) 5px minmax(0,1fr) 5px var(--rw,390px)}
  .col{overflow-y:auto; min-height:0}
  /* 分隔条：鼠标移上去变蓝，按住左右拖 */
  .split{cursor:col-resize; background:transparent; position:relative; z-index:5}
  .split::after{content:''; position:absolute; inset:0 2px; background:var(--line); transition:background .15s}
  .split:hover::after,.split.dragging::after{background:var(--accent)}
  body.resizing{cursor:col-resize; user-select:none}
  .col.left{border-right:1px solid var(--line); background:var(--panel)}
  .col.right{border-left:1px solid var(--line); background:var(--panel)}
  .col.center{background:var(--bg); scroll-behavior:smooth}

  .sec-head{padding:12px 14px 6px; font-size:11.5px; letter-spacing:.08em;
    color:var(--dim); text-transform:uppercase}
  .toc-item{padding:8px 14px; cursor:pointer; border-left:2px solid transparent;
    display:flex; gap:8px; align-items:baseline}
  .toc-item:hover{background:#1d222c}
  .toc-item.active{border-left-color:var(--accent); background:#1d2330}
  .toc-item .k{font-size:10.5px; padding:1px 6px; border-radius:4px; background:#252b37;
    color:var(--muted); flex:none}
  .toc-item .t{font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .toc-item .n{margin-left:auto; font-size:11px; color:var(--dim); flex:none}
  .toc-item.done .n{color:var(--ok)}

  /* 阅读区 */
  .paper-title{padding:22px 34px 6px; font-size:19px; font-weight:650}
  .paper-meta{padding:0 34px 16px; color:var(--muted); font-size:12.5px}
  .card{margin:0 34px 18px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--panel); overflow:hidden}
  .card-h{display:flex; align-items:center; gap:10px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:var(--panel-2); font-size:13px}
  .card-h .k{font-size:10.5px; padding:1px 6px; border-radius:4px; background:#2a3140; color:var(--muted)}
  .card-h .rate{margin-left:auto; font-size:11.5px; color:var(--muted)}
  .card-b{padding:6px 16px 12px; display:grid; gap:2px}
  .pair{display:grid; gap:6px}
  .pair .lab{font-size:11px; color:var(--dim); letter-spacing:.05em}
  .para{display:grid; gap:5px; padding:11px 0; border-bottom:1px dashed var(--line)}
  .para:last-child{border-bottom:none}
  .pno{font-size:10.5px; color:var(--dim); letter-spacing:.04em}
  .pno b{color:var(--accent); font-weight:600}
  .src{color:#a8b0c0; font-size:13px; font-family:ui-serif,Georgia,serif; line-height:1.7}
  .dst{color:var(--text); font-size:14px; line-height:1.85; white-space:pre-wrap}
  .cached{font-size:10px; color:var(--ok); margin-left:6px}
  /* 表格与插图：原来这些内容被直接丢掉了 */
  .tblwrap{overflow-x:auto; padding:8px 0 4px}
  .tbl{border-collapse:collapse; font-size:12.5px; min-width:100%}
  .tbl th,.tbl td{border:1px solid var(--line); padding:5px 9px; text-align:left; white-space:nowrap}
  .tbl th{background:#20262f; color:var(--muted); font-weight:500}
  .figs{display:flex; flex-wrap:wrap; gap:10px; padding:10px 0 2px}
  .figs figure{margin:0; flex:1 1 260px; max-width:340px; background:#11151b;
    border:1px solid var(--line); border-radius:8px; padding:7px}
  .figs img{width:100%; border-radius:4px; display:block; cursor:zoom-in; background:#fff}
  .figs figcaption{font-size:11px; color:var(--dim); padding-top:5px}
  details.pages{margin-top:8px}
  details.pages summary{cursor:pointer; color:var(--muted); font-size:12px; padding:5px 0}
  details.pages img{width:100%; border:1px solid var(--line); border-radius:6px; margin-top:8px; background:#fff}
  .zoom{position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center;
    justify-content:center; z-index:80; padding:30px}
  .zoom.show{display:flex}
  .zoom img{max-width:96vw; max-height:92vh; background:#fff; border-radius:6px}
  /* 正文内嵌的插图与公式（MinerU 解析时按 bbox 裁出来） */
  .inline-fig{margin:14px 0; background:#11151b; border:1px solid var(--line);
    border-radius:8px; padding:8px; max-width:560px}
  .inline-fig img{width:100%; border-radius:4px; display:block; cursor:zoom-in; background:#fff}
  .inline-fig figcaption{font-size:11.5px; color:var(--muted); padding-top:6px; line-height:1.6}
  .formula{margin:14px 0; padding:10px 12px; background:#11151b; border:1px solid var(--line);
    border-radius:8px; display:flex; flex-direction:column; gap:6px}
  .formula img{max-height:90px; width:auto; max-width:100%; align-self:flex-start;
    background:#fff; border-radius:4px; cursor:zoom-in; padding:3px 6px}
  .formula code{font-family:ui-monospace,Consolas,monospace; font-size:11.5px;
    color:var(--muted); word-break:break-all; line-height:1.6}
  /* KaTeX 渲染结果：可选中、可缩放，比图片清楚 */
  .eq-render{color:var(--text); font-size:1.05em; overflow-x:auto; padding:4px 0}
  .eq-render .katex{font-size:1.12em}
  /* 图片翻译的结果：原文/译文并排 */
  .imgcard{background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:12px}
  .imgcard-h{display:flex; gap:10px; align-items:center}
  .imgthumb{width:52px; height:52px; object-fit:cover; border-radius:6px; border:1px solid var(--line); flex:none}
  .imgtext{margin:0; padding:10px; background:#11151b; border:1px solid var(--line);
    border-radius:7px; font-size:12.5px; line-height:1.8; white-space:pre-wrap;
    word-break:break-word; max-height:340px; overflow:auto; color:var(--text);
    font-family:inherit}
  .empty{padding:60px 34px; color:var(--muted); text-align:center; line-height:2}
  .empty kbd{background:var(--panel-2); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; font-size:12px}
  .warnbox{margin:0 34px 16px; padding:10px 14px; border-radius:8px;
    background:rgba(210,153,34,.1); border:1px solid rgba(210,153,34,.35);
    color:#e3c07a; font-size:12.5px}

  /* 右栏 */
  .panel-block{padding:12px 16px; border-bottom:1px solid var(--line)}
  .panel-block h3{margin:0 0 8px; font-size:12px; color:var(--muted); font-weight:600;
    letter-spacing:.05em}
  .field{margin-bottom:9px}
  .field .fl{font-size:11px; color:var(--dim); margin-bottom:2px}
  .field .fv{font-size:13px; line-height:1.6; white-space:pre-wrap}
  .field ul{margin:0; padding-left:16px}
  .field li{margin-bottom:3px}
  .chip{display:inline-block; font-size:11px; padding:1px 7px; border-radius:20px;
    background:#252b37; color:var(--muted); margin:0 4px 4px 0}
  .chip.ok{background:rgba(63,185,80,.12); color:var(--ok)}
  .chip.bad{background:rgba(248,81,73,.12); color:var(--bad)}
  .ev{padding:7px 0; border-bottom:1px dashed var(--line); font-size:12px; color:#9aa3b4;
    font-family:ui-serif,Georgia,serif}
  .ev:last-child{border-bottom:none}
  .ev b{color:var(--muted); font-weight:500; font-family:inherit; font-size:11px}
  .note-md{padding:12px 16px; font-size:13px; line-height:1.8}
  .note-md h1,.note-md h2,.note-md h3{font-size:14px; margin:16px 0 8px; color:var(--accent)}
  .note-md h1{font-size:15px}
  .note-md h2{border-bottom:1px solid var(--line); padding-bottom:5px}
  /* 段落：段间距 + 中文习惯的首行缩进 2 字 */
  .note-md p{margin:0 0 10px; line-height:1.95; text-indent:2em; color:var(--text)}
  .note-md p:last-child{margin-bottom:0}
  .note-md ul,.note-md ol{padding-left:22px; margin:6px 0 10px}
  .note-md li{margin-bottom:5px; line-height:1.85}
  .note-md b{color:var(--text); font-weight:600}
  .note-md code{background:#1c2029; padding:1px 5px; border-radius:4px; font-size:12px}

  /* 弹层 */
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; z-index:50}
  .mask.show{display:flex}
  .modal{width:min(940px,94vw); max-height:86vh; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column;
    box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .modal-h{display:flex; align-items:center; gap:10px; padding:14px 18px;
    border-bottom:1px solid var(--line)}
  .modal-h h2{margin:0; font-size:15px}
  .modal-h .spacer{flex:1}
  .modal-b{padding:16px 18px; overflow:auto}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
  th{color:var(--muted); font-weight:500; font-size:12px; white-space:nowrap}
  td.nowrap{white-space:nowrap}
  td.ellip{max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  td button{padding:3px 9px; font-size:12px}
  button.danger{color:var(--bad); border-color:rgba(248,81,73,.35)}
  button.danger:hover{background:rgba(248,81,73,.12); border-color:var(--bad)}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  .row input{flex:1; min-width:110px}
  .hide{display:none !important}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:9px 16px; border-radius:8px; opacity:0; transition:.25s; pointer-events:none; z-index:99}
  .toast.show{opacity:1; transform:translateX(-50%)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2a303c; border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <div class="logo">Paper<span>Reader</span></div>
  <div class="status"><i class="dot" id="dot"></i><span id="modelTxt">检查模型…</span></div>
  <div class="spacer"></div>
  <div class="dd" id="ddRange">
    <button class="dd-btn" onclick="toggleDD('ddRange')">翻译范围：<b id="rangeLabel">全文</b> ▾</button>
    <div class="dd-menu">
      <div data-v="all" onclick="pickRange('all')">全文（除参考文献）</div>
      <div data-v="core" onclick="pickRange('core')">摘要 + 方法 + 实验</div>
      <div data-v="abstract" onclick="pickRange('abstract')">仅摘要（最快）</div>
    </div>
  </div>
  <div class="dd" id="ddParse">
    <button class="dd-btn" onclick="toggleDD('ddParse')">解析：<b id="parseLabel">快速</b> ▾</button>
    <div class="dd-menu">
      <div data-v="auto" onclick="pickParse('auto')">快速（PyMuPDF，约 10 秒）</div>
      <div data-v="mineru" onclick="pickParse('mineru')">精细（MinerU，约 30~60 秒/篇）</div>
    </div>
  </div>
  <div class="dd" id="ddModel">
    <button class="dd-btn" onclick="toggleDD('ddModel')">模型：<b id="modelLabel">本机</b> ▾</button>
    <div class="dd-menu" id="modelMenu"></div>
  </div>
  <button id="btnRerun" class="ghost hide" onclick="rerunCurrent()" title="按当前模型与术语库重新解析并翻译">重新翻译</button>
  <button id="btnSearch" class="ghost">检索</button>
  <button id="btnImage" class="ghost">图片翻译</button>
  <button id="btnTerms" class="ghost">术语库</button>
  <button id="btnNotes" class="ghost">历史笔记</button>
  <button id="btnPick" class="primary">选择 PDF</button>
  <input type="file" id="file" accept="application/pdf" hidden>
</header>
<div id="bar"><i></i></div>

<main id="main">
  <div class="col left">
    <div class="sec-head">章节</div>
    <div id="toc"></div>
  </div>
  <div class="split" data-side="left" title="拖动调整章节栏宽度"></div>
  <div class="col center" id="center">
    <div class="empty" id="empty">
      选一篇英文论文 PDF 开始<br>
      <span style="font-size:12.5px">解析 → 翻译 → 要素抽取 → 笔记，全部在本机完成</span>
    </div>
  </div>
  <div class="split" data-side="right" title="拖动调整右栏宽度"></div>
  <div class="col right" id="right">
    <div class="panel-block">
      <h3>结构化要素</h3>
      <div class="field"><div class="fv" style="color:var(--muted)">尚未处理论文</div></div>
    </div>
  </div>
</main>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-h">
      <h2 id="modalTitle">术语库</h2>
      <div class="spacer"></div>
      <button class="ghost" id="modalClose">关闭</button>
    </div>
    <div class="modal-b" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
// 渲染异常不能静默：出错时把原因写进页面标题，便于无头浏览器排查
window.onerror = (msg, src, line, col) => { document.title = 'ERR: ' + msg + ' @' + line + ':' + col; };
const el = (tag, cls, txt) => { const n = document.createElement(tag);
  if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; };
const KIND_CN = {abstract:'摘要',introduction:'引言',related:'相关工作',method:'方法',
  experiment:'实验',discussion:'讨论',conclusion:'结论',acknowledg:'致谢',
  references:'参考文献',appendix:'附录',other:'其他',front:'题名页'};

let task = null, timer = null, currentFile = null;
let RANGE = 'all';
let PARSE = 'auto';
let SETTINGS = null;
let LAST_CANDS = [];
let EQ_TEX = [];  // 当前渲染批次的公式 LaTeX，下标对应 .eq-render[data-eq]
const RANGE_LABEL = {all:'全文', core:'摘要+方法+实验', abstract:'仅摘要'};
const PARSE_LABEL = {auto:'快速', mineru:'精细'};

function toggleDD(id){
  const d = document.getElementById(id);
  document.querySelectorAll('.dd').forEach(x => { if(x !== d) x.classList.remove('open'); });
  d.classList.toggle('open');
}
function closeDD(){ document.querySelectorAll('.dd').forEach(x => x.classList.remove('open')); }
document.addEventListener('click', e => { if(!e.target.closest('.dd')) closeDD(); });

function pickRange(v){
  RANGE = v;
  $('#rangeLabel').textContent = RANGE_LABEL[v] || v;
  closeDD();
}

function pickParse(v){
  PARSE = v;
  $('#parseLabel').textContent = PARSE_LABEL[v] || v;
  closeDD();
}

function kindsFor(range){
  if(range === 'abstract') return ['abstract'];
  // "*" 交给服务端解释为"除参考文献/致谢外的全部章节"，包括认不出名字的 other
  if(range === 'all') return ['*'];
  return ['abstract','introduction','related','method','experiment','other','conclusion'];
}

/* ---------- 模型提供方 ---------- */
async function loadSettings(){
  try{
    SETTINGS = await api('/api/settings');
    const p = SETTINGS.providers[SETTINGS.active] || {};
    const warn = (p.backend !== 'ollama' && !p.has_key) ? '（缺密钥）' : '';
    $('#modelLabel').textContent = (p.label || '本机') + warn;
    $('#modelMenu').innerHTML = Object.entries(SETTINGS.providers).map(([k,v]) => `
      <div class="${k===SETTINGS.active?'sel':''}" onclick="switchProvider('${escapeHtml(k).replace(/'/g,'&#39;')}')">
        <span>${escapeHtml(v.label)}${k===SETTINGS.active?' ✓':''}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--dim)">
          ${v.backend==='ollama' ? '本地' : (v.has_key ? '已配密钥' : '未配密钥')}</span>
      </div>`).join('')
      + `<div class="hint" onclick="openProviderModal('${escapeHtml(SETTINGS.active).replace(/'/g,'&#39;')}')"
            style="cursor:pointer;color:var(--accent)">配置当前提供方（密钥 / 模型名）…</div>`;
  }catch(e){}
}

async function switchProvider(name){
  SETTINGS = await api('/api/settings', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({active:name})});
  closeDD(); await loadSettings(); health();
  const p = SETTINGS.providers[name] || {};
  if(p.backend !== 'ollama' && !p.has_key) openProviderModal(name);
}

function openProviderModal(name){
  const p = (SETTINGS && SETTINGS.providers[name]) || {};
  $('#modalTitle').textContent = '配置模型提供方：' + (p.label || name);
  $('#modalBody').innerHTML = `
    <div class="row"><input id="pBase" placeholder="接口地址（OpenAI 兼容）" value="${escapeHtml(p.base_url||'')}"></div>
    <div class="row"><input id="pModel" placeholder="模型名，如 deepseek-chat / doubao-seed-1-6" value="${escapeHtml(p.model||'')}"></div>
    <div class="row"><input id="pKey" type="password" placeholder="API Key（只存本机 data/settings.json）" value=""></div>
    <div style="color:var(--muted);font-size:12.5px;line-height:1.8;margin:8px 0 12px">
      云端模式下论文正文会发送到对应服务商，本地推理的隐私保证不再成立。<br>
      演示建议：本机模型讲"数据不出机"，云端模型只用于对比效果。
    </div>
    <button class="primary" onclick="saveProvider('${escapeHtml(name).replace(/'/g,'&#39;')}')">保存并测试</button>
    <span id="pTest" style="margin-left:12px;color:var(--muted);font-size:12.5px"></span>`;
  $('#mask').classList.add('show');
}

async function saveProvider(name){
  $('#pTest').textContent = '保存中…';
  const body = {name, base_url: $('#pBase').value.trim(), model: $('#pModel').value.trim()};
  const key = $('#pKey').value.trim();
  if(key) body.api_key = key;
  await api('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)});
  await loadSettings();
  const ok = await api('/api/health');
  $('#pTest').textContent = ok.ok ? '连接正常' : '连接失败，检查地址/密钥/模型名';
  $('#pTest').style.color = ok.ok ? 'var(--ok)' : 'var(--bad)';
  health();
}

function toast(msg, ms=2200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), ms);
}
async function api(url, opt={}){
  const r = await fetch(url, opt);
  const ct = r.headers.get('content-type') || '';
  if (ct.includes('json')) return r.json();
  return r.text();
}
function setBar(p){ $('#bar > i').style.width = Math.max(0, Math.min(1, p)) * 100 + '%'; }

/* ---------- 健康检查 ---------- */
async function health(){
  try{
    const h = await api('/api/health');
    const dot = $('#dot');
    dot.className = 'dot ' + (h.ok ? 'on' : 'off');
    const who = h.label ? `${h.label} · ${h.model}` : h.model;
    $('#modelTxt').textContent = h.ok
      ? `${who} · 术语 ${h.terms} 条`
      : `${who} 不可用（${h.base_url}）`;
  }catch(e){
    $('#dot').className='dot off'; $('#modelTxt').textContent='服务异常';
  }
}

/* ---------- 选文件 ---------- */
$('#btnPick').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  currentFile = f;
  $('#btnPick').disabled = true; $('#btnPick').textContent = '上传中…';
  try{
    const r = await fetch('/api/upload?name=' + encodeURIComponent(f.name), {method:'POST', body:f});
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    await start(j.path);
  }catch(err){ toast('上传失败：' + err.message, 3500); }
  finally{ $('#btnPick').disabled=false; $('#btnPick').textContent='选择 PDF'; }
};

async function start(path, force=false){
  const kinds = kindsFor(RANGE);
  const r = await api('/api/run', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path, kinds, backend: PARSE, force})});
  if(r.error){ toast(r.error, 3500); return; }
  if(r.from_snapshot){
    clearInterval(timer); timer = null;
    await loadTaskById(r.task_id, '已秒开历史精读记录（未重新翻译）');
    return;
  }
  task = {id:r.task_id, status:'running', progress:0, sections:[], stage:'解析', stage_index:1};
  $('#center').innerHTML = '<div class="empty">正在解析 PDF…</div>';
  $('#toc').innerHTML = ''; $('#right').innerHTML = '';
  setBar(0.02);
  clearInterval(timer); timer = setInterval(poll, 700);
}

async function loadTaskById(tid, tip){
  const t = await api('/api/task/' + tid);
  if(!t || t.error){ toast((t && t.error) || '加载失败', 3500); return; }
  task = t;
  $('#toc').dataset.sig = '';
  $('#center').dataset.sig = '';
  setBar(1);
  renderToc(t);
  renderRead(t, false);
  renderRight(t);
  if(tip) toast(tip, 2800);
}

function syncRerunBtn(){
  const b = document.getElementById('btnRerun');
  if(!b) return;
  const ok = !!(task && task.pdf);
  b.classList.toggle('hide', !ok);
  b.disabled = !!(task && (task.status === 'running' || task.status === 'queued'));
}

async function rerunCurrent(){
  if(!task || !task.pdf) return toast('当前记录缺少原 PDF 路径，请重新选择 PDF');
  if(!confirm('按当前模型与最新术语库重新解析并翻译这篇论文？')) return;
  await start(task.pdf, true);
}

async function poll(){
  if(!task) return;
  const t = await api('/api/task/' + task.id);
  if(t.error) return;
  task = t;
  syncRerunBtn();
  setBar(t.progress || 0);
  renderToc(t);
  if(t.status === 'queued'){
    // 云端模型没有显存限制，队列原因和本地不一样，别一律甩"8GB 显存"
    const why = (t.backend === 'ollama' || !t.backend)
      ? '本机只有一块 8GB 显存，同时跑两个会互相拖慢'
      : '前面还有任务没结束（云端模型可并行 3 个）';
    $('#center').innerHTML = `<div class="empty">已排队，前面还有任务在跑…<br>
      <span style="font-size:12.5px">${why}</span><br>
      <button onclick="forceStart()" style="margin-top:12px">强制立即开始</button></div>`;
  }else if(t.status === 'running'){
    // 还没解析出章节时给个占位；有了章节就完全交给 renderRead，
    // 两边都往 #center 写会互相覆盖，最后卡在占位上
    if(!t.sections || !t.sections.length){
      $('#center').innerHTML = `<div class="empty">${escapeHtml(t.stage || '解析')}…</div>`;
      return;
    }
    renderRead(t, true);
  }else if(t.status === 'done'){
    clearInterval(timer); timer = null; setBar(1);
    renderRead(t, false); renderRight(t);
    toast('处理完成，笔记已保存');
  }else if(t.status === 'cancelled'){
    clearInterval(timer); timer = null;
    renderRead(t, false); renderRight(t);
    toast('已停止，已译完的段落保留在页面上');
  }else if(t.status === 'error'){
    clearInterval(timer); timer = null;
    $('#center').innerHTML = `<div class="empty">处理失败<br>
      <span style="color:var(--bad)">${escapeHtml(t.error || '未知错误')}</span></div>`;
  }
}

/* ---------- 渲染：章节列表 ---------- */
function renderToc(t){
  const box = $('#toc'); if(!t.sections || !t.sections.length) return;
  const sig = t.sections.map(s => (s.paras||[]).some(p=>p.translation) ? 1 : 0).join('');
  if(box.dataset.sig === sig) return;
  box.dataset.sig = sig; box.innerHTML = '';
  t.sections.forEach((s, i) => {
    const done = (s.paras||[]).some(p => p.translation);
    const it = el('div', 'toc-item' + (done ? ' done' : ''));
    it.dataset.idx = i;
    it.append(el('span','k', KIND_CN[s.kind] || s.kind));
    it.append(el('span','t', s.title));
    it.append(el('span','n', done ? '已译' : `未译 · ${s.chars}字`));
    it.onclick = () => {
      document.querySelectorAll('.toc-item').forEach(x=>x.classList.remove('active'));
      it.classList.add('active');
      const card = document.getElementById('sec-' + i);
      if(card) card.scrollIntoView({block:'start'});
    };
    box.append(it);
  });
}

/* ---------- 渲染：正文对照 ---------- */
function renderRead(t, streaming){
  if(!t.sections || !t.sections.length) return;
  const center = $('#center');
  const paraDone = t.sections.reduce((n,s)=>n+(s.paras||[]).filter(p=>p.translation).length,0);
  const paraAll = t.sections.reduce((n,s)=>n+(s.paras||[]).length,0);
  const sig = [t.id || '', t.sections.length, streaming?1:0, t.status, paraDone, paraAll,
               t.stage || '', Math.round((t.progress||0)*100), t.from_snapshot?1:0].join('|');
  if(center.dataset.sig === sig) return;
  center.dataset.sig = sig;
  const keepY = center.scrollTop;
  EQ_TEX = [];  // 每次重绘重置公式表，data-eq 下标才对得上

  let html = `<div class="paper-title">${escapeHtml(t.title || '')}</div>    <div class="paper-meta">${escapeHtml(t.pages || '—')} 页 · 解析 ${escapeHtml(t.backend || '—')} ·
    ${t.sections.length} 章 · 段落 ${paraDone}/${paraAll} 已译</div>`;
  if(streaming){
    html += `<div class="warnbox" style="display:flex;align-items:center;gap:12px">
      <span style="flex:1">正在翻译（${escapeHtml(t.stage||'')}），已完成的段落可以先读。全文约 4~6 分钟。</span>
      <button onclick="cancelTask()" style="padding:5px 12px">停止</button></div>`;
  }else{
    if(t.from_snapshot){
      const staleTip = t.snapshot_stale ? '（术语库或模型已更新，可按需重译）' : '（直接复用历史结果，零耗时）';
      html += `<div class="warnbox" style="display:flex;align-items:center;gap:12px;
        background:rgba(110,168,254,.08);border-color:rgba(110,168,254,.3);color:var(--text)">
        <span style="flex:1">已从历史快照秒开${staleTip}</span>
        ${t.pdf ? '<button onclick="rerunCurrent()" style="padding:5px 12px">重新解析翻译</button>' : ''}
      </div>`;
    }
    // 只翻了部分章节时给出明确入口，不要让人以为"永远翻不完"
    const bodySecs = t.sections.filter(s => !['references','acknowledg','front'].includes(s.kind));
    const left = bodySecs.filter(s => !(s.paras || []).some(p => p.translation)).length;
    if(left > 0){
      html += `<div class="warnbox" style="display:flex;align-items:center;gap:12px">
        <span style="flex:1">还有 <b>${left}</b> 节正文没有翻译（当前只翻了部分章节）。</span>
        <button onclick="retranslate()" style="padding:5px 12px">继续翻译剩余 ${left} 节</button></div>`;
    }
  }
  t.sections.forEach((s, i) => {
    const paras = s.paras || [];
    const translated = paras.some(p => p.translation);
    if(!translated && streaming) return;
    const rate = s.term_rate;
    const head = `<div class="card-h">
        <span class="k">${KIND_CN[s.kind] || s.kind}</span>
        <span>${escapeHtml(s.title)}</span>
        ${rate !== null && rate !== undefined
          ? `<span class="rate">一致率 ${(rate*100).toFixed(0)}%${
              s.violations ? ` · 违例 ${s.violations}` : ''} · ${paras.length} 段 · ${(s.seconds||0).toFixed(1)}s${
              s.cache_hits ? ` · 缓存 ${s.cache_hits}` : ''}</span>`
          : ''}
      </div>`;
    const paraBlock = (p) => `
      <div class="para">
        <div class="pno">第 <b>${p.page}</b> 页${p.cached ? '<span class="cached">缓存</span>' : ''}${
          p.aligned === false ? '<span style="color:var(--warn)"> · 未按段对齐</span>' : ''}</div>
        <div class="src">${escapeHtml(p.source)}</div>
        ${p.translation ? `<div class="dst">${escapeHtml(p.translation)}</div>` : ''}
      </div>`;

    // MinerU 给的是带 rowspan/colspan 的 HTML，直接渲染比拍平的二维数组准
    // 快速档拿不到表格结构，只能按原页裁图显示
    const tableBlock = (t) => {
      if(!t.html && !(t.rows || []).length){
        return t.url ? `<div class="tblwrap"><img src="${t.url}" loading="lazy"
          style="max-width:100%;background:#fff;border-radius:4px;cursor:zoom-in"
          onclick="zoomImg('${t.url}')">
          <div class="pno">第 ${t.page} 页 · 表格（原图，快速档不解析表格结构）</div></div>` : '';
      }
      const inner = t.html
        ? sanitizeTableHtml(t.html)
        : (t.rows || []).map((r, ri) => `<tr>${
            (r || []).map(c => ri === 0 ? `<th>${escapeHtml(c)}</th>` : `<td>${escapeHtml(c)}</td>`).join('')
          }</tr>`).join('');
      return `<div class="tblwrap"><table class="tbl">${inner}</table>
        <div class="pno">第 ${t.page} 页 · 表格（原文结构，未翻译）</div></div>`;
    };

    const figureBlock = (f) => f.url ? `
      <figure class="inline-fig">
        <img src="${f.url}" loading="lazy" onclick="zoomImg('${f.url}')">
        <figcaption>第 ${f.page} 页 · ${escapeHtml(f.caption || '插图（点击放大）')}</figcaption>
      </figure>` : '';

    const formulaBlock = (x) => {
      // 有 LaTeX 就用 KaTeX 渲染（可选中、可缩放），原图作为对照保留
      let idx = -1;
      if(x.latex){ EQ_TEX.push(x.latex); idx = EQ_TEX.length - 1; }
      return `<div class="formula">
        ${idx >= 0 ? `<div class="eq-render" data-eq="${idx}"></div>` : ''}
        ${x.url ? `<img src="${x.url}" loading="lazy" onclick="zoomImg('${x.url}')">` : ''}
        ${idx < 0 && x.latex ? `<code>${escapeHtml(x.latex)}</code>` : ''}
        <div class="pno">第 ${x.page} 页 · 公式${idx >= 0 && x.url ? '（上为渲染，下为原图）' : ''}</div>
      </div>`;
    };

    // 没有 flow 时的降级路径：段落 + 章节末尾的表格/插图
    const tables = (s.tables || []).map(tableBlock).join('');
    const figs = (s.figures || []).length
      ? `<div class="figs">${s.figures.map(figureBlock).join('')}</div>` : '';
    const snaps = (s.page_images || []).length ? `
      <details class="pages"><summary>查看原文页（${s.page_images.length} 页，含矢量图表）</summary>
        ${s.page_images.map(p => `<img src="${p.url}" loading="lazy">
          <div class="pno">第 ${p.page} 页</div>`).join('')}
      </details>` : '';

    // 有 flow 就按版面顺序混排（表格/插图/公式回原位）；没有就退回"段落 + 末尾图表"
    let body;
    if((s.flow || []).length){
      body = s.flow.map(it => {
        if(it.type === 'text') return paraBlock(paras[it.para] || {page: s.page, source: '', translation: ''});
        if(it.type === 'table') return tableBlock(it);
        if(it.type === 'figure') return figureBlock(it);
        if(it.type === 'formula') return formulaBlock(it);
        return '';
      }).join('');
    }else{
      body = paras.map(paraBlock).join('') + tables + figs;
    }

    html += `<div class="card" id="sec-${i}">${head}<div class="card-b">${
      body || '<div class="src" style="color:var(--dim)">（本段未翻译）</div>'}${snaps}</div></div>`;
  });
  center.innerHTML = html;
  center.scrollTop = keepY;

  // 公式渲染：KaTeX 本地包，失败就退回 LaTeX 源码（不至于白屏）
  center.querySelectorAll('.eq-render').forEach(el => {
    const tex = EQ_TEX[Number(el.dataset.eq)];
    if(!tex) return;
    if(window.katex){
      try{ katex.render(tex, el, {displayMode:true, throwOnError:false, strict:false}); return; }
      catch(e){ /* 落到下面的源码显示 */ }
    }
    const code = document.createElement('code');
    code.textContent = tex;
    el.replaceWith(code);
  });
  // 支持 #sec-5 这类锚点：内容渲染完再滚，否则浏览器找不到节点
  // 延迟一拍是必要的：插图是懒加载，加载后高度变化会把滚动位置顶走
  if(location.hash){
    setTimeout(() => {
      const target = document.querySelector(location.hash);
      if(target) target.scrollIntoView({block:'start'});
    }, 400);
  }
}

function zoomImg(url){
  let box = document.getElementById('zoomBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'zoomBox'; box.className = 'zoom';
    box.onclick = () => box.classList.remove('show');
    box.innerHTML = '<img id="zoomImg">';
    document.body.appendChild(box);
  }
  document.getElementById('zoomImg').src = url;
  box.classList.add('show');
}

async function forceStart(){
  if(!task) return;
  const r = await api('/api/task/' + task.id + '/force', {method:'POST'});
  if(r.error) return toast(r.error);
  toast('已插队，马上开始');
  poll();
}

async function cancelTask(){
  if(!task) return;
  await api('/api/task/' + task.id + '/cancel', {method:'POST'});
  toast('已暂停，已译部分保留；点「继续翻译」接着跑');
}

async function retranslate(){
  if(!task) return;
  const r = await api('/api/retranslate', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({task_id: task.id})});
  if(r.error) return toast(r.error);
  toast('继续翻译，已完成的部分走缓存，只花没翻过的');
  if(!timer) timer = setInterval(poll, 1200);
  poll();
}

/* ---------- 渲染：右栏要素 ---------- */
function renderRight(t){
  const right = $('#right');
  const e = t.elements; if(!e) return;
  const f = e.fields || {};
  const rep = e.report || {};
  const list = v => Array.isArray(v) && v.length
    ? '<ul>' + v.map(x => `<li>${escapeHtml(typeof x === 'string' ? x : JSON.stringify(x))}</li>`).join('') + '</ul>'
    : '<span style="color:var(--dim)">—</span>';

  let html = `<div class="panel-block">
    <h3>AI 总结</h3>
    <div style="margin-bottom:9px">
      <button onclick="genSummary()" id="btnSum">${t.summary ? '重新生成总结' : '生成整篇总结'}</button>
    </div>
    <div class="note-md" id="sumView" style="padding:0">${
      t.summary ? mdToHtml(t.summary)
                : '<span style="color:var(--dim);font-size:12.5px">按审稿人视角输出八节：三十秒版 / 问题定位 / 方法与思路 / 创新点真伪 / 实验与证据 / 局限与不足 / 跟进方向 / 不确定的地方，每节不少于 300 字。</span>'
    }</div>
  </div>
  <div class="panel-block">
    <h3>质量</h3>
    <span class="chip ${rep.hit_rate >= 0.9 ? 'ok' : 'bad'}">证据命中 ${(rep.hit_rate*100||0).toFixed(0)}%</span>
    <span class="chip">${rep.evidence_verified}/${rep.evidence_total} 条</span>
    <span class="chip">${(rep.fields||[]).length} 字段</span>
    <div style="margin-top:8px;color:var(--dim);font-size:11.5px">
      ${Object.entries(t.timings||{}).map(([k,v])=>`${k} ${v.toFixed(1)}s`).join(' · ')}
    </div>
  </div>
  <div class="panel-block"><h3>一句话总结</h3>
    <div class="field"><div class="fv">${escapeHtml(f.research_question || '—')}</div></div>
    <div class="field"><div class="fl">前人不足</div>
      <div class="fv">${escapeHtml(f.gap || '—')}</div></div>
  </div>
  <div class="panel-block"><h3>方法要点</h3><div class="field">${list(f.method)}</div></div>
  <div class="panel-block"><h3>数据与指标</h3>
    <div class="field"><div class="fl">数据集</div><div class="fv">${list(f.dataset)}</div></div>
    <div class="field"><div class="fl">指标</div><div class="fv">${list(f.metrics)}</div></div>
    <div class="field"><div class="fl">关键数字</div>
      ${Array.isArray(f.key_results) && f.key_results.length
        ? f.key_results.map(k => `<div class="fv">· ${escapeHtml(k.metric||'')}：<b>${escapeHtml(String(k.value||''))}</b>${k.baseline?`（对比 ${escapeHtml(k.baseline)}）`:''}</div>`).join('')
        : '<span style="color:var(--dim)">—</span>'}
    </div>
  </div>
  <div class="panel-block"><h3>创新点</h3><div class="field">${list(f.novelty)}</div></div>
  <div class="panel-block"><h3>局限与疑问</h3><div class="field">${list(f.limitations)}</div></div>
  <div class="panel-block"><h3>原文依据</h3>
    ${(e.evidence||[]).map(ev => `<div class="ev"><b>${escapeHtml(ev.field)}</b> ${ev.verified?'<span class="chip ok">已回查</span>':'<span class="chip bad">未命中</span>'}<br>${escapeHtml(ev.quote)}</div>`).join('') || '<span style="color:var(--dim)">—</span>'}
  </div>
  <div class="panel-block"><h3>笔记</h3>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button onclick="toggleEditNote()" id="btnEditNote">编辑笔记</button>
      <button onclick="downloadNote()">导出 .md</button>
      <button onclick="copyNote()">复制全文</button>
    </div>
    <div class="note-md" id="noteView">${mdToHtml(t.note_md || '')}</div>
    <div id="noteEditor" class="hide" style="margin-top:8px">
      <textarea id="noteArea" oninput="previewNoteEdit()" style="width:100%;height:230px;font-family:ui-monospace,Consolas,monospace;
        font-size:12.5px;line-height:1.75"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="primary" onclick="saveNote()">保存笔记（覆盖原文）</button>
        <button onclick="toggleEditNote()">取消</button>
      </div>
    </div>
  </div>
  <div class="panel-block"><h3>我的批注（独立保存，导出时附在末尾）</h3>
    <textarea id="annoArea" placeholder="读的时候想到什么写在这里，会跟笔记一起导出"
      style="width:100%;height:110px;font-size:13px;line-height:1.7"></textarea>
    <div style="margin-top:8px"><button onclick="saveAnno()">保存批注</button></div>
  </div>`;
  right.innerHTML = html;
  if(t.note_id){
    api('/api/note/' + t.note_id).then(n => {
      if(!n || n.error) return;
      if(typeof n.note_md === 'string' && n.note_md !== task.note_md){
        task.note_md = n.note_md;
        if($('#noteView')) $('#noteView').innerHTML = mdToHtml(n.note_md);
      }
      if(n.user_note && $('#annoArea')) $('#annoArea').value = n.user_note;
    }).catch(()=>{});
  }
}

async function genSummary(){
  if(!task) return toast('先处理一篇论文');
  const btn = $('#btnSum');
  btn.disabled = true; btn.textContent = '总结中…';
  const view = $('#sumView');
  if(view) view.innerHTML = '<span style="color:var(--muted);font-size:12.5px">正在生成八节拆解…</span>';

  // 八节是并发生成的，轮询拿进度，让用户看到"3/8"而不是干等
  let alive = true;
  const tick = setInterval(async () => {
    if(!alive || !task) return;
    const t = await api('/api/task/' + task.id).catch(() => null);
    if(t && t.stage && t.stage.startsWith('总结')){
      btn.textContent = t.stage + '…';
      if(view) view.innerHTML = `<span style="color:var(--muted);font-size:12.5px">${escapeHtml(t.stage)}，并行生成中…</span>`;
    }
  }, 2000);

  let r = {};
  try{
    r = await api('/api/summary', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({task_id: task.id})});
  }finally{
    alive = false; clearInterval(tick);
    btn.disabled = false; btn.textContent = '重新生成总结';
  }
  if(r.error){ toast(r.error, 5000); if(view) view.innerHTML = ''; return; }
  task.summary = r.summary;
  if(view) view.innerHTML = mdToHtml(r.summary);
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sanitizeTableHtml(raw){
  try{
    const doc = new DOMParser().parseFromString(String(raw || ''), 'text/html');
    const trs = doc.querySelectorAll('tr');
    if(!trs.length) return '';
    return [...trs].map(tr => {
      const cells = [...tr.querySelectorAll('th,td')].map(c => {
        const tag = c.tagName.toLowerCase() === 'th' ? 'th' : 'td';
        const rs = parseInt(c.getAttribute('rowspan') || '', 10);
        const cs = parseInt(c.getAttribute('colspan') || '', 10);
        const attrs = (rs > 1 ? ` rowspan="${rs}"` : '') + (cs > 1 ? ` colspan="${cs}"` : '');
        return `<${tag}${attrs}>${escapeHtml(c.textContent)}</${tag}>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
  }catch(e){
    return '';
  }
}
function mdToHtml(md){
  // 逐行处理：标题 / 无序列表 / 有序列表 / 段落，各走各的标签。
  // 以前把空行换成 <br><br>，模型写一大段时整屏就是一坨，没有段间距。
  const lines = escapeHtml(md).replace(/\r\n/g, '\n').split('\n');
  const out = [];
  let para = [], list = null;

  const flushPara = () => {
    if(para.length){ out.push('<p>' + para.join('<br>') + '</p>'); para = []; }
  };
  const flushList = () => {
    if(list){
      out.push('<' + list.tag + '>' + list.items.map(i => '<li>' + i + '</li>').join('') + '</' + list.tag + '>');
      list = null;
    }
  };

  for(const raw of lines){
    const line = raw.trim();
    if(!line){ flushPara(); flushList(); continue; }

    const h = line.match(/^(#{1,4})\s+(.+)$/);
    if(h){
      flushPara(); flushList();
      const lv = Math.min(h[1].length, 3);
      out.push('<h' + lv + '>' + h[2] + '</h' + lv + '>');
      continue;
    }

    const ul = line.match(/^[-*]\s+(.+)$/);
    if(ul){
      flushPara();
      if(!list || list.tag !== 'ul'){ flushList(); list = {tag:'ul', items:[]}; }
      list.items.push(ul[1]);
      continue;
    }

    const ol = line.match(/^\d+[.)]\s+(.+)$/);
    if(ol){
      flushPara();
      if(!list || list.tag !== 'ol'){ flushList(); list = {tag:'ol', items:[]}; }
      list.items.push(ol[1]);
      continue;
    }

    flushList();
    para.push(line);
  }
  flushPara(); flushList();

  return out.join('')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

/* ---------- 三栏宽度拖拽 ---------- */
(function initSplit(){
  const main = document.getElementById('main');
  if(!main) return;
  const MIN = 170;          // 最窄
  const saved = JSON.parse(localStorage.getItem('pr_cols') || '{}');
  if(saved.lw) main.style.setProperty('--lw', saved.lw + 'px');
  if(saved.rw) main.style.setProperty('--rw', saved.rw + 'px');

  const clamp = (v, side) => {
    // 两边加起来不能把中间挤没：中间至少留 360px
    const total = main.clientWidth - 10;
    const other = side === 'left'
      ? parseInt(getComputedStyle(main).getPropertyValue('--rw')) || 390
      : parseInt(getComputedStyle(main).getPropertyValue('--lw')) || 250;
    return Math.max(MIN, Math.min(v, total - other - 360));
  };

  document.querySelectorAll('.split').forEach(bar => {
    bar.addEventListener('mousedown', e => {
      e.preventDefault();
      const side = bar.dataset.side;
      const startX = e.clientX;
      const prop = side === 'left' ? '--lw' : '--rw';
      const startW = parseInt(getComputedStyle(main).getPropertyValue(prop)) || (side === 'left' ? 250 : 390);
      bar.classList.add('dragging');
      document.body.classList.add('resizing');

      const move = ev => {
        const delta = side === 'left' ? (ev.clientX - startX) : (startX - ev.clientX);
        const w = clamp(startW + delta, side);
        main.style.setProperty(prop, w + 'px');
      };
      const up = () => {
        bar.classList.remove('dragging');
        document.body.classList.remove('resizing');
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        const lw = parseInt(getComputedStyle(main).getPropertyValue('--lw')) || 250;
        const rw = parseInt(getComputedStyle(main).getPropertyValue('--rw')) || 390;
        localStorage.setItem('pr_cols', JSON.stringify({lw, rw}));
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  });

  // 窗口变窄时把两栏拉回来，别把中间挤没
  window.addEventListener('resize', () => {
    const lw = parseInt(getComputedStyle(main).getPropertyValue('--lw')) || 250;
    const rw = parseInt(getComputedStyle(main).getPropertyValue('--rw')) || 390;
    if(lw + rw + 360 > main.clientWidth - 10){
      const ratio = (main.clientWidth - 10 - 360) / (lw + rw);
      main.style.setProperty('--lw', Math.max(MIN, Math.round(lw * ratio)) + 'px');
      main.style.setProperty('--rw', Math.max(MIN, Math.round(rw * ratio)) + 'px');
    }
  });
})();

function imageCardHtml(j, idx){
  const warn = j.error ? `<div style="color:var(--warn);font-size:12.5px;margin-bottom:8px">${escapeHtml(j.error)}</div>` : '';
  const metaParts = [
    j.name ? escapeHtml(j.name) : '',
    `${j.chars || (j.text || '').length || 0} 字`,
    j.seconds ? `${Number(j.seconds).toFixed(1)} 秒` : '',
    j.created_at ? escapeHtml(String(j.created_at).replace('T',' ').slice(0,16)) : '',
  ].filter(Boolean).join(' · ');
  const thumb = j.thumb ? `<img src="${j.thumb}" class="imgthumb" alt="">` : '';
  return `
    <div class="imgcard">
      ${warn}
      <div class="imgcard-h">
        ${thumb}
        <div style="flex:1;min-width:0">
          <div style="font-size:12.5px;color:var(--muted)">${metaParts}</div>
        </div>
        <button onclick="copyText(document.getElementById('imgTgt${idx}').innerText)">复制译文</button>
        <button onclick="copyText(document.getElementById('imgSrc${idx}').innerText)">复制原文</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px">
        <div><div class="pno">原文</div><pre id="imgSrc${idx}" class="imgtext">${escapeHtml(j.text||'')}</pre></div>
        <div><div class="pno">译文</div><pre id="imgTgt${idx}" class="imgtext">${escapeHtml(j.translation||'')}</pre></div>
      </div>
    </div>`;
}

async function translateImage(file){
  const list = $('#imgList');
  if(!list) return;
  const idx = ++_imgSeq;
  const holder = document.createElement('div');
  holder.className = 'imgcard';
  holder.innerHTML = `<div style="color:var(--muted);font-size:13px">${escapeHtml(file.name || '图片')} 识别中…（约 10~30 秒）</div>`;
  list.insertBefore(holder, list.firstChild);
  let j = null;
  try{
    const r = await fetch('/api/image/translate?name=' + encodeURIComponent(file.name || 'image.png'),
      {method:'POST', body:file});
    j = await r.json();
  }catch(err){
    holder.innerHTML = `<div style="color:var(--bad)">请求失败：${escapeHtml(String(err))}</div>`;
    return;
  }
  if(!j || (j.error && !j.text)){
    holder.innerHTML = `<div style="color:var(--bad)">${escapeHtml((j && j.error) || '处理失败')}</div>`;
    return;
  }
  holder.outerHTML = imageCardHtml(j, idx);
  await loadImageHistory();
}

    .filter(s => ['abstract','introduction','method'].includes(s.kind))
    .map(s => (s.paras||[]).map(p=>p.source).join('\n'))

  const r = await api('/api/terms/candidates', {method:'POST',

  if(r.error){ box.innerHTML = `<div style="color:var(--bad);font-size:12.5px">${escapeHtml(r.error)}</div>`; return; }

  box.innerHTML = `<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">
      挖到 ${cands.length} 条，勾选后入库（领域已自动识别，可按需修改；已在库的不可选）</div>
    <table><thead><tr><th></th><th>原文</th><th>译法</th><th>领域</th><th>说明</th><th>状态</th></tr></thead>
    <tbody>${cands.map((c,i)=>`<tr>
      <td style="width:26px"><input type="checkbox" data-i="${i}" ${c.in_db?'disabled':''} ${c.in_db?'':'checked'}></td>
      <td>${escapeHtml(c.source)}</td><td>${escapeHtml(c.target)}</td>
      <td style="width:110px"><input type="text" data-domain-i="${i}" value="${escapeHtml(c.domain||'general')}"
        style="width:100%;padding:3px 6px;font-size:12px" ${c.in_db?'disabled':''}></td>
      <td style="color:var(--muted);font-size:12px">${escapeHtml(c.reason||'')}</td>
      <td>${c.in_db?'<span class="chip">已在库</span>':'<span class="chip ok">新候选</span>'}</td>
    </tr>`).join('')}</tbody></table>
    <div style="margin-top:10px"><button class="primary" onclick="acceptCands()">入库选中项</button></div>`;
}

async function acceptCands(cands){
  const list = cands || LAST_CANDS || [];
  const picked = [...document.querySelectorAll('#candBox input[type=checkbox]')]
    .filter(cb => cb.checked && !cb.disabled)
    .map(cb => {
      const idx = Number(cb.dataset.i);
      const item = list[idx];
      if(!item) return null;
      const dEl = document.querySelector(`#candBox input[data-domain-i="${idx}"]`);
      return {...item, domain: (dEl && dEl.value.trim()) || item.domain || 'general'};
    })
    .filter(Boolean);
  if(!picked.length) return toast('没有选中任何候选');
  const r = await api('/api/terms/accept', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({candidates: picked})});
  toast(`入库 ${r.accepted || 0} 条`);
  $('#btnTerms').click(); health();
}

async function addTerm(){
  const source = $('#tSrc').value.trim(), target = $('#tTgt').value.trim();
  if(!source || !target) return toast('原文和译法都要填');
  const r = await api('/api/terms', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({source, target, domain:$('#tDomain').value.trim() || 'general'})});
  if(r.error) return toast(r.error);
  toast('已添加'); $('#btnTerms').click(); health();
}
async function delTerm(source){
  if(!confirm(`删除术语「${source}」？`)) return;
  await api('/api/terms/delete', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({source})});
  toast('已删除'); $('#btnTerms').click(); health();
}

/* ---------- 历史笔记 ---------- */
async function renderNotesModal(){
  const j = await api('/api/notes');
  const notes = j.notes || [];
  const oldCnt = notes.filter(n => !n.has_snapshot).length;
  const rows = notes.map(n => `<tr>
      <td class="nowrap">#${n.id}</td>
      <td class="ellip" title="${escapeHtml(n.title||n.paper_path)}">${escapeHtml(n.title||n.paper_path)}</td>
      <td class="nowrap">${((n.term_rate||1)*100).toFixed(0)}%</td>
      <td class="nowrap">${escapeHtml((n.created_at||'').replace('T',' ').slice(0,16))}</td>
      <td class="nowrap">
        <div style="display:inline-flex;gap:6px">
          ${n.has_snapshot ? `<button class="primary" onclick="openPaperSnapshot(${n.id})">打开阅读</button>` : ''}
          <button onclick="openNote(${n.id})">查看笔记</button>
          <button class="danger" onclick="delNote(${n.id})">删除</button>
        </div>
      </td>
    </tr>`).join('');
  $('#modalTitle').textContent = `历史笔记（${notes.length} 条）`;
  $('#modalBody').innerHTML = `
    <div class="row" style="align-items:center;margin-bottom:10px">
      <span style="color:var(--muted);font-size:12px;flex:1">
        带「打开阅读」的记录可直接秒开完整双语界面；删除会同时清理对应快照与检索索引。
      </span>
      ${oldCnt ? `<button onclick="clearNotes('old')" style="padding:4px 10px;font-size:12px">清理无快照旧记录（${oldCnt}）</button>` : ''}
      ${notes.length ? `<button class="danger" onclick="clearNotes('all')" style="padding:4px 10px;font-size:12px">清空全部</button>` : ''}
    </div>
    <div style="max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:8px">
      <table><thead><tr><th>ID</th><th>论文</th><th>一致率</th><th>时间</th><th>操作</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="color:var(--dim)">还没有笔记</td></tr>'}</tbody></table>
    </div>
    <div id="histNoteView" style="margin-top:14px"></div>`;
  $('#mask').classList.add('show');
}
$('#btnNotes').onclick = renderNotesModal;
async function delNote(id){
  if(!confirm(`删除历史笔记 #${id}（含关联快照与检索记录）？`)) return;
  const r = await api('/api/note/' + id + '/delete', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({})});
  if(r && r.ok){ toast('已删除'); await renderNotesModal(); }
  else toast('删除失败');
}
async function clearNotes(mode){
  const msg = mode === 'all'
    ? '确定清空全部历史笔记与阅读快照？此操作不可恢复。'
    : '清理所有不带「打开阅读」快照的旧笔记（保留可秒开的精读快照）？';
  if(!confirm(msg)) return;
  const r = await api('/api/notes/clear', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({mode})});
  toast(`已清理 ${(r && r.deleted) || 0} 条记录`);
  await renderNotesModal();
}
async function openNote(id){
  const box = $('#histNoteView');
  if(!box) return;
  box.innerHTML = '<div style="color:var(--muted);font-size:12.5px">加载中…</div>';
  const n = await api('/api/note/' + id);
  if(!n || n.error){
    box.innerHTML = `<div style="color:var(--bad);font-size:12.5px">${escapeHtml((n && n.error) || '加载失败')}</div>`;
    return;
  }
  const full = (n.note_md || '').trim() + (n.user_note && n.user_note.trim() ? '\n\n## 我的批注\n\n' + n.user_note.trim() : '');
  box.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-bottom:6px">
      <b style="font-size:13.5px">#${n.id} ${escapeHtml(n.title || '')}</b>
      <span style="flex:1"></span>
      <button onclick="location.href='/api/note/${n.id}/export?t='+Date.now()">导出 .md</button>
    </div>
    <div class="note-md" style="padding:4px 0">${full ? mdToHtml(full) : '<span style="color:var(--dim)">（这条笔记正文为空）</span>'}</div>`;
  box.scrollIntoView({behavior:'smooth', block:'start'});
}
async function openPaperSnapshot(noteId){
  const r = await api('/api/note/' + noteId + '/open', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({})});
  if(!r || r.error){ toast((r && r.error) || '无法打开阅读快照', 3500); return; }
  closeModal();
  await loadTaskById(r.task_id, '已打开历史精读界面（未重新翻译）');
}

function closeModal(){
  $('#mask').classList.remove('show');
  document.onpaste = null;  // 关掉弹窗后不该再拦粘贴
}
$('#modalClose').onclick = closeModal;
$('#mask').onclick = e => { if(e.target.id === 'mask') closeModal(); };

/* ---------- 恢复上一次任务（刷新不丢结果） ---------- */
async function restore(){
  try{
    const t = await api('/api/task/last');
    if(!t || t.error || !t.sections || !t.sections.length) return;
    task = t; syncRerunBtn(); renderToc(t);
    if(t.status === 'running'){
      setBar(t.progress || 0); renderRead(t, true);
      clearInterval(timer); timer = setInterval(poll, 700);
    }else if(t.status === 'done'){
      setBar(1); renderRead(t, false); renderRight(t);
    }
  }catch(e){}
}

health(); loadSettings(); restore(); setInterval(health, 15000);
</script>
</body>
</html>
